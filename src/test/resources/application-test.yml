spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

  batch:
    jdbc:
      initialize-schema: never
      table-prefix: batch.BATCH_
    job:
      enabled: false

  kafka:
    listener:
      auto-startup: false

jwt:
  secret: dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdA==
